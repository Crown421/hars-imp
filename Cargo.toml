[package]
name = "hars-imp"
version = "0.2.0"
edition = "2021"
description = "Home Assistant MQTT/D-Bus bridge for Linux"
repository = "https://github.com/Crown421/hars-imp"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# MQTT
rumqttc = "0.24"
rustls-native-certs = "0.7"
rustls-pemfile = "2"

# D-Bus
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# System monitoring
sysinfo = "0.33"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
libc = "0.2"
thiserror = "2"

# Async trait support
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
